name: ecosync-ai
services:
  ollama:
    image: ollama/ollama:0.40.15@sha256:0e59999e0e8f9fd4e704bd788a89b7e4cad399367fb1365f8c102ac662288761
    platform: linux/amd64
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["models:/root/.ollama"]
    networks: [control, download]
    mem_limit: 3g
    cpus: 3.0
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      timeout: 3s
      retries: 24
networks:
  control:
    name: ecosync-ai_control
    internal: true
  download:
    name: ecosync-ai_download
volumes:
  models:
