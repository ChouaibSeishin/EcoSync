services:
  backend:
    environment:
      AI_ENABLED: "${AI_ENABLED:-false}"
      AI_PROVIDER: "${AI_PROVIDER:-ollama}"
      AI_MODEL: "${AI_MODEL:-qwen3:1.7b}"
      AI_MODEL_DIGEST: "${AI_MODEL_DIGEST:-8f68893c685c3ddff2aa3fffce2aa60a30bb2da65ca488b61fff134a4d1730e7}"
      AI_OLLAMA_URL: http://ollama:11434
      AI_SOURCE_BINDINGS: /run/ecosync/chat-bindings.json
    volumes:
      - ../../.verification/chat/bindings.json:/run/ecosync/chat-bindings.json:ro
