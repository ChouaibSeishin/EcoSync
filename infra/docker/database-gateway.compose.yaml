name: ecosync-database
services:
  database-gateway:
    image: ecosync-managed-database-gateway:phase4
    build: {context: ../../managed-gateway}
    platform: linux/amd64
    environment:
      DATABASE_ENVIRONMENT: development
      DATABASE_GATEWAY_HOST: database-gateway
      DATABASE_GATEWAY_TOKEN: ${DATABASE_GATEWAY_TOKEN:?Run init-database.mjs}
      DATABASE_DELEGATION_PUBLIC_KEY: /run/ecosync/assertion-public.der
      DATABASE_AUTHORITY_URL: http://backend:8080
      DATABASE_DESTINATIONS: POSTGRESQL|sales|5432|sales|sales|dev,MYSQL|inventory|3306|inventory|inventory|dev,POSTGRESQL|sales|5432|sales|sales|tls,MYSQL|inventory|3306|inventory|inventory|tls
      DATABASE_ALLOWED_CIDRS: ${DATABASE_ALLOWED_CIDRS:?Source subnet required}
    volumes:
      - ../../.verification/database/assertion-public.der:/run/ecosync/assertion-public.der:ro
    networks: [control, sources]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 640m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/8093; printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 25
networks:
  control:
    name: ecosync-database_control
    internal: true
  sources:
    external: true
    name: ecosync-demo-v1_sources
