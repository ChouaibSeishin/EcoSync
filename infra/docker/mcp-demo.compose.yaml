name: ecosync-mcp
services:
  sales-mcp:
    image: ecosync-sales-mcp:phase3
    build: {context: ../../mcp-servers/sales}
    platform: linux/amd64
    environment:
      SALES_READER_PASSWORD: ${SALES_READER_PASSWORD:?Run init-demo.mjs}
      SALES_MCP_TOKEN: ${SALES_MCP_TOKEN:?Run init-mcp.mjs}
    networks: [sources, control]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/8091; printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 25
  inventory-mcp:
    image: ecosync-inventory-mcp:phase3
    build: {context: ../../mcp-servers/inventory}
    platform: linux/amd64
    environment:
      INVENTORY_READER_PASSWORD: ${INVENTORY_READER_PASSWORD:?Required}
      INVENTORY_MCP_TOKEN: ${INVENTORY_MCP_TOKEN:?Required}
    networks: [sources, control]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8092/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 25
  mcp-client:
    image: ecosync-native-mcp-client:phase3
    build: {context: ../../mcp-client}
    platform: linux/amd64
    environment:
      MCP_ENVIRONMENT: development
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN:?Required}
      MCP_ALLOWED_ENDPOINTS: http://sales-mcp:8091/mcp,http://inventory-mcp:8092/mcp
    networks: [control]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8090/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
networks:
  sources:
    external: true
    name: ecosync-demo-v1_sources
  control:
    name: ecosync-mcp_control
    internal: true
