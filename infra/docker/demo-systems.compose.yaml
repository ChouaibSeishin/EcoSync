name: ecosync-demo-v1
services:
  sales:
    image: postgres:17.11-bookworm@sha256:2cd2c0f809604aaeff6f0ec8f40aecbd025613107561015c69369a1a7f1d3416
    platform: linux/amd64
    environment:
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
      POSTGRES_DB: sales
      POSTGRES_USER: sales_owner
      POSTGRES_PASSWORD: ${SALES_OWNER_PASSWORD:?Run node scripts/init-demo.mjs}
      SALES_MIGRATION_PASSWORD: ${SALES_MIGRATION_PASSWORD:?Required}
      SALES_READER_PASSWORD: ${SALES_READER_PASSWORD:?Required}
      TZ: UTC
    ports: ["127.0.0.1:${SALES_PORT:-55433}:5432"]
    volumes:
      - sales-data:/var/lib/postgresql/data
      - ../../demo-systems/sales-postgres/init.sh:/docker-entrypoint-initdb.d/10-sales.sh:ro
      - ../../demo-systems/sales-postgres/migrations:/migrations:ro
    networks: [sources]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_owner -d sales && PGPASSWORD=$$SALES_READER_PASSWORD psql -h 127.0.0.1 -U sales_reader -d sales -Atc 'SELECT count(*)=432 FROM sales.order_lines' | grep -qx t"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s
  inventory:
    image: mysql:8.4.13@sha256:5cf1e1293ea42e077e6a22114e6773b9aae3bb8f9933a2acd5a9721518ff8f5b
    platform: linux/amd64
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_ROOT_PASSWORD: ${INVENTORY_ROOT_PASSWORD:?Required}
      INVENTORY_MIGRATION_PASSWORD: ${INVENTORY_MIGRATION_PASSWORD:?Required}
      INVENTORY_READER_PASSWORD: ${INVENTORY_READER_PASSWORD:?Required}
      TZ: UTC
    command: ["--default-time-zone=+00:00", "--mysqlx=0", "--local-infile=0"]
    ports: ["127.0.0.1:${INVENTORY_PORT:-53307}:3306"]
    volumes:
      - inventory-data:/var/lib/mysql
      - ../../demo-systems/inventory-mysql/init.sh:/docker-entrypoint-initdb.d/10-inventory.sh:ro
      - ../../demo-systems/inventory-mysql/migrations:/migrations:ro
    networks: [sources]
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$INVENTORY_READER_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u inventory_reader -D inventory -Nse 'SELECT count(*)=90 FROM stock_levels' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 50
      start_period: 30s
  supplier:
    image: ecosync-demo-supplier:phase2
    platform: linux/amd64
    build:
      context: ../../demo-systems/supplier-api
    environment:
      SUPPLIER_API_TOKEN: ${SUPPLIER_API_TOKEN:?Required}
    ports: ["127.0.0.1:${SUPPLIER_PORT:-18081}:8081"]
    networks: [sources]
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
volumes:
  sales-data:
  inventory-data:
networks:
  sources:
    driver: bridge
