name: Ecosync verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ecosync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-30
        with:
          persist-credentials: false
      - name: Set up maintained Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify toolchain and foundation
        run: |
          node --version
          npm --version
          java -version
          node scripts/verify-foundation.mjs
          node scripts/review-repository.mjs
          git diff --check
      - name: Backend build, unit tests and PostgreSQL integration tests
        working-directory: backend
        run: ./mvnw -B -ntp verify
      - name: Frontend clean install, lint, types, tests, build and audit
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test -- --run
          npm run build
          npm audit --audit-level=high
      - name: Install pinned browser
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Validate and start real local stack
        run: |
          node scripts/init-local.mjs
          docker compose -f infra/docker/compose.yaml config --quiet
          docker compose -f infra/docker/compose.yaml build backend frontend
          docker compose -f infra/docker/compose.yaml up -d --wait --wait-timeout 180
      - name: Browser smoke and security verification
        run: node scripts/run-e2e.mjs
      - name: Persistence, outage and recovery verification
        run: node scripts/verify-local-stack.mjs
      - name: Stop only this job's stack
        if: always()
        run: |
          if [ -f infra/docker/.env ]; then
            docker compose -f infra/docker/compose.yaml stop
          fi
  managed_database:
    name: Managed database gateway and connector governance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up pinned Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            managed-gateway/pom.xml
            verification/gateway-compatibility/java/pom.xml
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mcp-client/package-lock.json
            mcp-servers/inventory/package-lock.json
      - name: Build actual platform and gateway; real PostgreSQL and MySQL tests
        run: |
          ./backend/mvnw -B -ntp -f backend/pom.xml verify
          ./backend/mvnw -B -ntp -f managed-gateway/pom.xml verify
          ./backend/mvnw -B -ntp -f mcp-servers/sales/pom.xml package
          ./backend/mvnw -B -ntp -f verification/gateway-compatibility/java/pom.xml package
      - name: Preserve native services and check the extended React UI
        run: |
          npm ci --prefix mcp-client
          npm run verify --prefix mcp-client
          npm ci --prefix mcp-servers/inventory
          npm run verify --prefix mcp-servers/inventory
          npm ci --prefix frontend
          npm run lint --prefix frontend
          npm run typecheck --prefix frontend
          npm test --prefix frontend -- --run
          npm run build --prefix frontend
          npm audit --prefix frontend --audit-level=high
          npm audit --prefix mcp-client --audit-level=high
          npm audit --prefix mcp-servers/inventory --audit-level=high
      - name: Install pinned browser
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Independent authenticated gateway compatibility proof
        run: |
          mkdir -p .verification/phase4
          docker build -t ecosync-gateway-proof:phase4 -f verification/gateway-compatibility/Dockerfile .
          docker run --rm --network none --memory 768m --cpus 2 --mount "type=bind,source=$PWD/.verification/phase4,target=/evidence" ecosync-gateway-proof:phase4
      - name: Start independent sources and generate separate gateway identities
        run: |
          node scripts/init-local.mjs
          node scripts/init-demo.mjs
          node scripts/init-mcp.mjs
          docker compose --env-file infra/docker/demo.env -f infra/docker/demo-systems.compose.yaml up -d --build --wait --wait-timeout 240
          node scripts/init-database.mjs
          sudo chgrp 10001 .verification/mcp/keyring.json .verification/database/assertion-private.der
          chmod 640 .verification/mcp/keyring.json .verification/database/assertion-private.der
          chmod 644 .verification/database/assertion-public.der
          node scripts/mcp-mask-secrets.mjs
          node scripts/provision-database-readers.mjs
      - name: Start actual native MCP, private database gateway and opted-in platform
        run: |
          docker compose --env-file infra/docker/demo.env --env-file infra/docker/.env.mcp -f infra/docker/mcp-demo.compose.yaml -f verification/mcp-compatibility/observe.compose.yaml up -d --build --wait --wait-timeout 180
          docker compose --env-file infra/docker/.env.database -f infra/docker/database-gateway.compose.yaml -f verification/gateway-compatibility/observe.compose.yaml up -d --build --wait --wait-timeout 180
          docker compose --env-file infra/docker/.env --env-file infra/docker/.env.mcp --env-file infra/docker/.env.database -f infra/docker/compose.yaml -f infra/docker/mcp-platform.override.yaml -f infra/docker/database-platform.override.yaml up -d --build --wait --wait-timeout 180
      - name: Actual gateway queries, delegated identity, adversarial cases and recovery
        run: node scripts/verify-database-stack.mjs
      - name: Real database browser journeys and unchanged native MCP journeys
        run: |
          node scripts/run-database-e2e.mjs
          node scripts/run-mcp-e2e.mjs
      - name: Source fixtures, all earlier jobs and known-secret review
        run: |
          node scripts/demo/validate-dataset.mjs
          node scripts/verify-foundation.mjs
          node scripts/review-repository.mjs
          git diff --check
          git diff --exit-code
      - name: Bounded redacted managed database diagnostics on failure
        if: failure()
        run: node scripts/database-diagnostics.mjs
      - name: Stop only this job's disposable projects, retain volumes
        if: always()
        run: |
          if [ -f infra/docker/.env.database ]; then
            docker compose --env-file infra/docker/.env --env-file infra/docker/.env.mcp --env-file infra/docker/.env.database -f infra/docker/compose.yaml -f infra/docker/mcp-platform.override.yaml -f infra/docker/database-platform.override.yaml down --timeout 10
            docker compose --env-file infra/docker/.env.database -f infra/docker/database-gateway.compose.yaml -f verification/gateway-compatibility/observe.compose.yaml down --timeout 10
          fi
          if [ -f infra/docker/.env.mcp ]; then
            docker compose --env-file infra/docker/demo.env --env-file infra/docker/.env.mcp -f infra/docker/mcp-demo.compose.yaml -f verification/mcp-compatibility/observe.compose.yaml down --timeout 10
          fi
          if [ -f infra/docker/demo.env ]; then
            docker compose --env-file infra/docker/demo.env -f infra/docker/demo-systems.compose.yaml down --timeout 10
          fi
  demo:
    name: Independent demo sources and dataset
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-30
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: demo-systems/supplier-api/package-lock.json
      - name: Foundation and source review
        run: |
          node scripts/verify-foundation.mjs
          node scripts/review-repository.mjs
          git diff --check
      - name: Supplier clean install, types, build, OpenAPI, HTTP tests and audit
        working-directory: demo-systems/supplier-api
        run: |
          npm ci
          npm run verify
          npm audit --audit-level=high
      - name: Reproduce fixtures, mappings, cases, expected facts and hashes
        run: |
          node scripts/demo/generate-sales.mjs --check
          node scripts/demo/generate-inventory.mjs --check
          node scripts/demo/generate-suppliers.mjs --check
          node scripts/demo/generate-api-contract.mjs --check
          node scripts/demo/prepare-mappings.mjs --check
          node scripts/demo/prepare-cases.mjs --check
          node scripts/demo/validate-dataset.mjs
          node scripts/demo/prepare-ground-truth.mjs
      - name: Build and initialize real independent sources
        run: |
          node scripts/init-demo.mjs
          docker compose --env-file infra/docker/demo.env -f infra/docker/demo-systems.compose.yaml config --quiet
          docker compose --env-file infra/docker/demo.env -f infra/docker/demo-systems.compose.yaml build supplier
          docker compose --env-file infra/docker/demo.env -f infra/docker/demo-systems.compose.yaml up -d --wait --wait-timeout 240
      - name: Demo startup diagnostics on failure
        if: failure()
        run: |
          if [ -f infra/docker/demo.env ]; then
            docker compose --env-file infra/docker/demo.env -f infra/docker/demo-systems.compose.yaml logs --no-color --tail 100 sales inventory supplier
          fi
      - name: Exact source data, database denials and independent SQL ground truth
        run: |
          node scripts/demo/verify-sales.mjs
          node scripts/demo/verify-inventory.mjs
          node scripts/demo/verify-api.mjs
          node scripts/demo/verify-ground-truth-live.mjs
      - name: Independent outage/restart and persistence
        run: node scripts/demo/verify-ecosystem.mjs
      - name: Two fresh initializations with different random credentials
        run: node scripts/demo/verify-reproducibility.mjs
      - name: Final fixture and source review
        run: |
          node scripts/demo/prepare-ground-truth.mjs
          node scripts/review-repository.mjs
          git diff --exit-code
      - name: Stop only this job's demo stack
        if: always()
        run: |
          if [ -f infra/docker/demo.env ]; then
            docker compose --env-file infra/docker/demo.env -f infra/docker/demo-systems.compose.yaml stop
          fi
  native_mcp:
    name: Native MCP interoperability and governance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up pinned Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            mcp-servers/sales/pom.xml
            verification/mcp-compatibility/java/pom.xml
      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: |
            mcp-client/package-lock.json
            mcp-servers/inventory/package-lock.json
            frontend/package-lock.json
            verification/mcp-compatibility/typescript/package-lock.json
      - name: Foundation and preserved source review
        run: |
          node scripts/verify-foundation.mjs
          node scripts/review-repository.mjs
          git diff --check
      - name: Clean client and Inventory installs, types, real peer tests and audits
        run: |
          npm ci --prefix mcp-client
          npm run verify --prefix mcp-client
          npm audit --prefix mcp-client --audit-level=high
          npm ci --prefix mcp-servers/inventory
          npm run verify --prefix mcp-servers/inventory
          npm audit --prefix mcp-servers/inventory --audit-level=high
      - name: Build Java platform, Sales server and compatibility peer
        run: |
          ./backend/mvnw -B -ntp -f backend/pom.xml package
          ./backend/mvnw -B -ntp -f mcp-servers/sales/pom.xml package
          ./backend/mvnw -B -ntp -f verification/mcp-compatibility/java/pom.xml package
      - name: Clean frontend install and management UI checks
        run: |
          npm ci --prefix frontend
          npm run lint --prefix frontend
          npm run typecheck --prefix frontend
          npm test --prefix frontend -- --run
          npm run build --prefix frontend
          npm audit --prefix frontend --audit-level=high
      - name: Install pinned browser
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Generate independent local credentials and protect the external key
        run: |
          node scripts/init-local.mjs
          node scripts/init-demo.mjs
          node scripts/init-mcp.mjs
          mkdir -p .verification/phase3
          sudo chgrp 10001 .verification/mcp/keyring.json
          chmod 640 .verification/mcp/keyring.json
          node scripts/mcp-mask-secrets.mjs
      - name: Actual Java and TypeScript dual-era compatibility matrix
        run: |
          docker build -t ecosync-mcp-compatibility:phase3 verification/mcp-compatibility
          docker run --rm --network none --memory 768m --cpus 2 --mount "type=bind,source=$PWD/.verification/phase3,target=/workspace/.verification/phase3" --mount "type=bind,source=$PWD/mcp-client,target=/client,readonly" -e MCP_FOUNDATION_MODULE=/client/dist/manager.js ecosync-mcp-compatibility:phase3
      - name: Start actual independent sources, native MCP servers and platform
        run: |
          docker compose --env-file infra/docker/demo.env -f infra/docker/demo-systems.compose.yaml up -d --build --wait --wait-timeout 240
          docker compose --env-file infra/docker/demo.env --env-file infra/docker/.env.mcp -f infra/docker/mcp-demo.compose.yaml -f verification/mcp-compatibility/observe.compose.yaml up -d --build --wait --wait-timeout 180
          docker compose --env-file infra/docker/.env --env-file infra/docker/.env.mcp -f infra/docker/compose.yaml -f infra/docker/mcp-platform.override.yaml up -d --build --wait --wait-timeout 180
      - name: Six source-backed tools and exact source evidence over actual MCP
        run: docker run --rm --network ecosync-mcp_control --env-file infra/docker/.env.mcp --mount "type=bind,source=$PWD,target=/repo,readonly" --entrypoint node ecosync-native-mcp-client:phase3 /repo/verification/mcp-compatibility/sources.mjs
      - name: Registry, denied operations, real outages, recovery, isolation and credential checks
        run: node scripts/verify-mcp-stack.mjs
      - name: Actual authenticated legacy and modern browser journeys
        run: node scripts/run-mcp-e2e.mjs
      - name: Final known-secret and source review
        run: |
          node scripts/review-repository.mjs
          git diff --check
          git diff --exit-code
      - name: Bounded redacted diagnostics on failure
        if: failure()
        run: node scripts/mcp-diagnostics.mjs
      - name: Stop only this job's disposable projects, retain volumes
        if: always()
        run: |
          if [ -f infra/docker/.env.mcp ]; then
            docker compose --env-file infra/docker/.env --env-file infra/docker/.env.mcp -f infra/docker/compose.yaml -f infra/docker/mcp-platform.override.yaml down --timeout 10
            docker compose --env-file infra/docker/demo.env --env-file infra/docker/.env.mcp -f infra/docker/mcp-demo.compose.yaml -f verification/mcp-compatibility/observe.compose.yaml down --timeout 10
            docker compose --env-file infra/docker/demo.env -f infra/docker/demo-systems.compose.yaml down --timeout 10
          fi
